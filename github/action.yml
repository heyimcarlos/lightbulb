name: "Lightbulb GitHub Action (unsupported)"
description: "Fails fast because Lightbulb does not yet ship a supported GitHub Action."
branding:
  icon: "code"
  color: "orange"

runs:
  using: "composite"
  steps:
    - name: Fail unsupported Lightbulb action
      shell: bash
      run: |
        echo "::error::The inherited GitHub Action is disabled in Lightbulb. A Lightbulb-native action is deferred until action identity, release channel, and token exchange decisions are made."
        exit 1
