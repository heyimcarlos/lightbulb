<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PR 47 Lightbulb command path evidence</title>
  <desc id="desc">Terminal-style evidence showing lightbulb as the primary command and opencode lightbulb as the compatibility path.</desc>
  <rect width="1200" height="720" fill="#111827"/>
  <rect x="32" y="32" width="1136" height="656" rx="8" fill="#020617" stroke="#334155"/>
  <circle cx="64" cy="64" r="7" fill="#ef4444"/>
  <circle cx="88" cy="64" r="7" fill="#f59e0b"/>
  <circle cx="112" cy="64" r="7" fill="#22c55e"/>
  <text x="48" y="112" fill="#94a3b8" font-family="monospace" font-size="20">$ cd packages/opencode</text>
  <text x="48" y="152" fill="#e5e7eb" font-family="monospace" font-size="20">$ ./bin/lightbulb dashboard --help</text>
  <text x="80" y="194" fill="#38bdf8" font-family="monospace" font-size="24">lightbulb dashboard</text>
  <text x="80" y="236" fill="#cbd5e1" font-family="monospace" font-size="20">show the Lightbulb account work graph</text>
  <text x="80" y="278" fill="#22c55e" font-family="monospace" font-size="20">primary command path exits 0</text>
  <line x1="48" y1="320" x2="1152" y2="320" stroke="#334155"/>
  <text x="48" y="370" fill="#e5e7eb" font-family="monospace" font-size="20">$ ./bin/opencode lightbulb dashboard --help</text>
  <text x="80" y="412" fill="#facc15" font-family="monospace" font-size="24">opencode lightbulb dashboard</text>
  <text x="80" y="454" fill="#cbd5e1" font-family="monospace" font-size="20">show the Lightbulb account work graph</text>
  <text x="80" y="496" fill="#22c55e" font-family="monospace" font-size="20">compatibility command path exits 0</text>
  <line x1="48" y1="538" x2="1152" y2="538" stroke="#334155"/>
  <text x="48" y="588" fill="#e5e7eb" font-family="monospace" font-size="20">$ bun test test/cli/lightbulb.test.ts</text>
  <text x="80" y="630" fill="#22c55e" font-family="monospace" font-size="22">8 pass, 0 fail</text>
</svg>
